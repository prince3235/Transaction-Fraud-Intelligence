name: Docker Compose Integration Test

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create .env file from secrets
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgrespassword" >> .env
          echo "POSTGRES_DB=test_fraud_db" >> .env
          
      - name: Start Docker Compose stack
        run: docker compose -f docker-compose.yml up -d --build
        
      - name: Wait for API health
        run: |
          echo "Waiting for API to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "status"; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i: API not ready yet. Retrying in 2s..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "Timeout waiting for API"
              exit 1
            fi
          done
          
      - name: Run Smoke Tests
        run: |
          echo "Testing GET /health"
          curl -f http://localhost:8000/health
          
          echo "Testing POST /predict"
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"amount": 1000, "type": "TRANSFER", "oldbalanceOrg": 5000, "newbalanceOrig": 4000, "oldbalanceDest": 0, "newbalanceDest": 1000, "step": 1}'
            
          echo "Testing GET /alerts"
          curl -f http://localhost:8000/alerts
          
      - name: Capture logs on failure
        if: failure()
        run: |
          docker compose logs > docker-compose-failure.log
          
      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose-failure.log
          
      - name: Cleanup
        if: always()
        run: docker compose down -v
