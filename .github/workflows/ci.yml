name: CI (root)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-lint:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: |
          find . -name "*.py" -not -path "./node_modules/*" -not -path "./frontend/*" \
            | xargs -I{} python -m py_compile {} && echo "All Python files compile OK"
