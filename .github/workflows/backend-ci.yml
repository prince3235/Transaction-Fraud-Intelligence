name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'alembic/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'alembic/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  security-scan:
    name: Security scan (eval/exec + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for builtin eval()/exec() in Python codebase
        run: |
          echo "Scanning for builtin eval() and exec() usage in src/ and api/..."
          # Match only calls to builtin eval/exec, not method calls like
          # `evaluator.eval(...)` or `obj.exec(...)`.
          if grep -rnE '(^|[^.a-zA-Z_])\b(eval|exec)\s*\(' src/ api/; then
            echo "ERROR: builtin eval() or exec() found! Remote Code Execution vulnerability."
            exit 1
          fi
          echo "No builtin eval()/exec() usage detected. Security scan passed."

  pytest:
    name: pytest (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_fraud_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx  # for API integration tests
        pip install pytest pytest-cov pytest-asyncio

    - name: Run Alembic migrations
      env:
        DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_fraud_db
      run: |
        alembic upgrade head

    - name: Run pytest with coverage
      env:
        DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_fraud_db
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'dummy_key_for_tests' }}
        SEED_DEMO_USERS: '0'
      run: |
        pytest -v --cov=src --cov=api --cov-report=term-missing --cov-report=xml

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml
